<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Biennal de València CVO 2026 - Circuit de Tallers</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Leaflet CSS (Mapa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <style>
        :root {
            --biennal-turquoise: #0096a6;
            --biennal-turquoise-dark: #0f768b;
            --bg-lime: #a2cd47;
            --text-main: #111111;
            --text-muted: #444444;
            --white: #ffffff;
            --color-yellow: #ffde00;
            --color-fuchsia: #d8008f;
            --color-red: #e50012;
            --color-blue: #0066cc;
            --color-agenda-lime: #8bb335;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Estilo para las barras de desplazamiento laterales (ordenador y móvil) */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.25);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0,0,0,0.4);
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #084c59;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Contenedor principal responsive adaptado a altura dinámica real (dvh) */
        .phone-container {
            width: 100%;
            max-width: 414px;
            height: 100dvh;
            max-height: 915px;
            background-color: var(--biennal-turquoise);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        @media (min-width: 415px) {
            .phone-container {
                height: 90vh;
                max-height: 880px;
                border-radius: 36px;
                border: 8px solid #2c3e50;
            }
        }

        /* Sistema de Pantallas */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            background-color: var(--biennal-turquoise);
            z-index: 1;
            overflow: hidden;
        }

        .screen.active {
            display: flex;
            z-index: 10;
        }

        /* --- CABECERA SUPERIOR FIJA COMÚN --- */
        .header-top {
            background-color: var(--biennal-turquoise);
            padding: 12px 16px 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            color: var(--white);
            z-index: 50;
            flex-shrink: 0;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .brand-title h2 {
            font-size: 17px;
            font-weight: 800;
            line-height: 1.1;
        }
        .brand-title p {
            font-size: 10.5px;
            font-weight: 700;
            opacity: 0.95;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }
        .lang-pills {
            display: flex;
            gap: 4px;
        }
        .lang-pill {
            font-size: 10px;
            font-weight: 800;
            background: rgba(255, 255, 255, 0.85);
            color: var(--biennal-turquoise);
            padding: 4px 8px;
            border-radius: 12px;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .lang-pill.active {
            background: var(--white);
            color: var(--biennal-turquoise-dark);
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        /* --- BARRA DE NAVEGACIÓN INFERIOR FIJA (ESTILO IMAGEN) --- */
        .bottom-nav {
            background: var(--white);
            margin: 0 14px 14px 14px;
            border-radius: 35px;
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.25);
            z-index: 1000;
            flex-shrink: 0;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            background: none;
            border: none;
            color: #111111;
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            margin-bottom: 2px;
            fill: currentColor;
        }

        /* Colores específicos de los iconos según la imagen de referencia */
        .nav-item-info { color: #111111; }
        .nav-item-info svg { fill: #111111; }

        .nav-item-agenda { color: var(--color-agenda-lime); }
        .nav-item-agenda svg { fill: var(--color-agenda-lime); }

        .nav-item-map { color: var(--color-red); }
        .nav-item-map svg { fill: var(--color-red); }

        /* --- CONTENEDOR CENTRAL CON SCROLL --- */
        .scrollable-content-area {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            padding: 10px 14px 14px 14px;
            gap: 14px;
        }

        /* --- PANTALLA 2: INFO --- */
        #screen-2 {
            background-color: var(--bg-lime);
        }

        .green-hero-container {
            width: 100%;
            height: 380px;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            flex-shrink: 0;
            background-color: #93c238;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .green-hero-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            display: block;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0.05) 40%, rgba(0,0,0,0.5) 100%);
            pointer-events: none;
        }

        .hero-floating-content {
            position: absolute;
            bottom: 16px;
            left: 18px;
            right: 18px;
            color: var(--white);
            z-index: 5;
        }

        .hero-edition {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--color-yellow);
            margin-bottom: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        .hero-floating-content h2 {
            font-size: 24px;
            font-weight: 800;
            line-height: 1.1;
            color: var(--color-yellow);
            margin-bottom: 4px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }

        .hero-dates {
            font-size: 12.5px;
            font-weight: 700;
            opacity: 0.95;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        .card-white-presentacion {
            background: var(--white);
            border-radius: 24px;
            padding: 18px 20px;
            color: var(--text-main);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .card-white-presentacion p.desc {
            font-size: 12px;
            line-height: 1.4;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 500;
        }
        .card-white-presentacion .free-access {
            font-size: 12px;
            font-weight: 700;
            color: #111;
            margin-bottom: 12px;
        }

        .color-dots {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            margin-top: 4px;
        }
        .dot {
            width: 17px;
            height: 17px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .dot:hover { transform: scale(1.15); }
        .dot-yellow { background-color: var(--color-yellow); }
        .dot-fuchsia { background-color: var(--color-fuchsia); }
        .dot-red { background-color: var(--color-red); }
        .dot-blue { background-color: var(--color-blue); }

        /* --- PANTALLA 3: MAPA INTERACTIVO --- */
        .map-screen-container {
            position: relative;
            width: 100%;
            flex: 1;
            z-index: 1;
        }
        #map {
            width: 100%;
            height: 100%;
            background-color: #e5e3df;
        }

        .custom-pin {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.35);
        }
        .pin-yellow { background-color: var(--color-yellow); }
        .pin-fuchsia { background-color: var(--color-fuchsia); }
        .pin-red { background-color: var(--color-red); }
        .pin-blue { background-color: var(--color-blue); }

        /* --- DESPLEGABLE INFORMATIVO EN MAPA --- */
        .bottom-sheet {
            position: absolute;
            bottom: -100%;
            left: 0;
            width: 100%;
            background: var(--white);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.25);
            transition: bottom 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1500;
            max-height: 75vh;
            display: flex;
            flex-direction: column;
        }
        .bottom-sheet.open {
            bottom: 0;
        }
        .sheet-handle {
            width: 36px;
            height: 4px;
            background-color: #ced4da;
            border-radius: 2px;
            margin: 10px auto 4px auto;
        }
        .sheet-body {
            padding: 10px 20px 85px 20px;
            overflow-y: auto;
        }
        .sheet-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 4px;
            padding-right: 20px;
        }
        .sheet-artists {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--biennal-turquoise-dark);
            margin-bottom: 6px;
        }
        .sheet-address {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }
        .sheet-info-block {
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 8px;
        }
        .sheet-info-label {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 3px;
        }
        .sheet-info-value {
            font-size: 0.84rem;
            color: var(--text-main);
            line-height: 1.35;
        }
        .sheet-contact-group {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            font-size: 0.8rem;
            color: var(--biennal-turquoise-dark);
            font-weight: 600;
        }
        .sheet-close-btn {
            position: absolute;
            top: 10px;
            right: 14px;
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        /* --- PANTALLA 4: AGENDA --- */
        #screen-4 {
            background-color: var(--biennal-turquoise);
        }
        .date-selectors {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            z-index: 5;
            flex-shrink: 0;
        }
        .date-box {
            flex: 1;
            background: var(--white);
            border-radius: 14px;
            padding: 10px 6px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .date-box.active-day {
            border-color: var(--biennal-turquoise-dark);
            transform: scale(1.03);
        }
        .date-box.yellow { background-color: var(--color-yellow); color: #111; }
        .date-box.fuchsia { background-color: var(--color-fuchsia); color: var(--white); }
        .date-box.red { background-color: var(--color-red); color: var(--white); }
        .date-box .day-num { font-size: 20px; font-weight: 800; display: block; }
        .date-box .day-name { font-size: 10.5px; font-weight: 700; text-transform: uppercase; }

        .agenda-card-container {
            background: var(--white);
            border-radius: 22px;
            padding: 16px;
            margin-top: 10px;
            color: var(--text-main);
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
        }
        .event-card-item {
            background: #fdfdfd;
            border: 1px solid #eee;
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .event-tag {
            display: inline-block;
            background: #e0f4f8;
            color: var(--biennal-turquoise-dark);
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            margin-bottom: 6px;
        }
        .event-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .event-loc { font-size: 11.5px; color: var(--text-muted); margin-bottom: 6px; }
        .event-desc { font-size: 12px; color: #444; line-height: 1.3; }
    </style>
</head>

                <div class="dot dot-red"></div>
            </div>
        </div>
    </div>

    <!-- PANTALLA 2: INFO (CABECERO Y PIE FIJOS, SCROLL CENTRAL) -->
    <div id="screen-2" class="screen">
        <div class="header-top">

                <button class="back-btn" onclick="goToScreen(1)">←</button>
                <div class="brand-title">

                    <p>CIUTAT VELLA OBERTA</p>

            </div>

                <button class="lang-pill lang-pill-btn" onclick="setLanguage('val')">VAL</button>
                <button class="lang-pill lang-pill-btn" onclick="setLanguage('eng')">ENG</button>
            </div>
        </div>

        <div class="scrollable-content-area">
